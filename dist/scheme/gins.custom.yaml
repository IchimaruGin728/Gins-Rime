patch:
  schema/dependencies/+:
    - melt_eng

  switches/@3/reset: 1
  switches/@5/reset: 1
  switches/@11/reset: 1

  engine/translators/+:
    - table_translator@melt_eng
    - table_translator@gins_eng
    - table_translator@gins_cn_en

  gins_eng:
    dictionary: gins_eng
    enable_sentence: false
    enable_completion: true
    enable_user_dict: false
    initial_quality: 0.4
    comment_format:
      - xform/.*//

  gins_cn_en:
    dictionary: ""
    user_dict: en_dicts/cn_en
    db_class: tabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 0.3

  key_binder/bindings/+:
    - { when: always, accept: "Control+Shift+4", toggle: s2t }

  translator/initial_quality: 1.0
  melt_eng/initial_quality: 0.5
