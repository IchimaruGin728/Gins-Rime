name: Sync Upstream Sources

on:
  schedule:
    - cron: '28 23 * * *' # 07:28 SGT
    - cron: '16 9 * * *'  # 17:16 SGT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Core Engine ─────────────────────────────────────────────
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest tag
        id: meta
        run: |
          TAG=$(curl -s https://api.github.com/repos/amzxyz/rime_wanxiang/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check tag
        id: check
        run: |
          CURRENT=$(cat .upstream/core.tag 2>/dev/null || echo "none")
          echo "stale=$( [ '$CURRENT' != '${{ steps.meta.outputs.tag }}' ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Clone and copy
        if: steps.check.outputs.stale == 'true'
        run: |
          git clone --depth 1 https://github.com/amzxyz/rime_wanxiang.git /tmp/core
          
          # 1. Sync Scheme YAMLs & Dictionaries
          mkdir -p scheme/shared/core/dicts
          cp /tmp/core/wanxiang.schema.yaml         scheme/shared/core/core.schema.yaml
          cp /tmp/core/wanxiang_algebra.yaml        scheme/shared/core/core_algebra.yaml
          cp /tmp/core/wanxiang_symbols.yaml        scheme/shared/core/core_symbols.yaml
          
          # Sync core dictionaries (Crucial for engine functionality)
          cp /tmp/core/wanxiang_english.dict.yaml   scheme/shared/core/dicts/core_english.dict.yaml
          cp /tmp/core/wanxiang_mixedcode.dict.yaml scheme/shared/core/dicts/core_mixedcode.dict.yaml
          cp /tmp/core/wanxiang_reverse.dict.yaml   scheme/shared/core/dicts/core_reverse.dict.yaml
          cp /tmp/core/wanxiang_reverse.schema.yaml  scheme/shared/core/core_reverse.schema.yaml
          
          # Sync all other core dictionary files
          cp /tmp/core/*.dict.yaml scheme/shared/core/dicts/ 2>/dev/null || true
          
          # Apply purification to internal dictionary names
          find scheme/shared/core/dicts -name "*.dict.yaml" -type f -exec sed -i 's/wanxiang/core/g' {} +
          find scheme/shared/core/dicts -name "*.dict.yaml" -type f -exec sed -i 's/万象/核心/g' {} +
          
          # 2. Sync Lua Logic & Purify
          rm -rf lua/core lua/data
          mkdir -p lua/core lua/data
          cp -r /tmp/core/lua/wanxiang/. lua/core/
          cp -r /tmp/core/lua/data/. lua/data/
          mv lua/core/wanxiang.lua lua/core/core.lua
          
          # Apply branding purification to Lua & YAML content (Deep Purification)
          find lua/core -name "*.lua" -type f -exec sed -i 's/wanxiang/core/g' {} +
          find lua/core -name "*.lua" -type f -exec sed -i 's/万象/核心/g' {} +
          find scheme/shared/core -name "*.yaml" -type f -exec sed -i 's/wanxiang/core/g' {} +
          find scheme/shared/core -name "*.yaml" -type f -exec sed -i 's/万象/核心/g' {} +
          
          # 3. Generate Purified rime.lua
          cat <<EOF > rime.lua
          -- Gins-Rime Purified Logic Engine Entry Point
          core = require('core/core')

          -- Processors
          core.auto_phrase = require('core/auto_phrase')
          core.input_statistics = require('core/input_statistics')
          core.key_binder = require('core/key_binder')
          core.partial_commit = require('core/partial_commit')
          core.super_processor = require('core/super_processor')
          core.super_tips = require('core/super_tips')
          core.super_sequence = require('core/super_sequence')
          core.user_predict = require('core/user_predict')

          -- Translators
          core.number_translator = require('core/number_translator')
          core.set_schema = require('core/set_schema')
          core.shijian = require('core/shijian')
          core.unicode = require('core/unicode')
          core.version_display = require('core/version_display')

          -- Filters
          core.charset_filter = require('core/charset_filter')
          core.super_calculator = require('core/super_calculator')
          core.super_comment_preedit = require('core/super_comment_preedit')
          core.super_english = require('core/super_english')
          core.super_filter = require('core/super_filter')
          core.super_lookup = require('core/super_lookup')
          core.super_replacer = require('core/super_replacer')

          -- Global exports
          auto_phrase = core.auto_phrase
          input_statistics = core.input_statistics
          key_binder = core.key_binder
          partial_commit = core.partial_commit
          super_processor = core.super_processor
          super_tips = core.super_tips
          super_sequence = core.super_sequence
          user_predict = core.user_predict
          number_translator = core.number_translator
          set_schema = core.set_schema
          shijian = core.shijian
          unicode = core.unicode
          version_display = core.version_display
          charset_filter = core.charset_filter
          super_calculator = core.super_calculator
          super_comment_preedit = core.super_comment_preedit
          super_english = core.super_english
          super_filter = core.super_filter
          super_lookup = core.super_lookup
          super_replacer = core.super_replacer
          EOF
          
          mkdir -p .upstream && echo "${{ steps.meta.outputs.tag }}" > .upstream/core.tag

      - name: Open PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/core-${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git add scheme/shared/core/ lua/ rime.lua .upstream/core.tag
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: core engine ${{ steps.meta.outputs.tag }}"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "sync: core engine ${{ steps.meta.outputs.tag }}" \
            --body "Auto-synced core logic from upstream releases." \
            --base main --head "$BRANCH" || true

  # ── 萌娘百科 ────────────────────────────────────────────────
  sync-moetype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest release
        id: meta
        run: |
          DATA=$(curl -s https://api.github.com/repos/suiginko/moetype/releases/latest)
          TAG=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          URL=$(echo "$DATA" | python3 -c "
          import sys,json
          for a in json.load(sys.stdin)['assets']:
              if a['name'] == 'tone_moe.dict.yaml':
                  print(a['browser_download_url']); break
          ")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Check tag
        id: check
        run: |
          CURRENT=$(cat .upstream/moetype.tag 2>/dev/null || echo "none")
          echo "stale=$( [ '$CURRENT' != '${{ steps.meta.outputs.tag }}' ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Download
        if: steps.check.outputs.stale == 'true'
        run: |
          curl -L -o dicts/tone_moe.dict.yaml "${{ steps.meta.outputs.url }}"
          mkdir -p .upstream && echo "${{ steps.meta.outputs.tag }}" > .upstream/moetype.tag

      - name: Upload to R2 + trigger Workflow
        if: steps.check.outputs.stale == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put gins-rime/dicts/tone_moe.dict.yaml \
            --file dicts/tone_moe.dict.yaml \
            --content-type "text/yaml"
          DATE=$(date +%Y%m%d)
          LINES=$(wc -l < dicts/tone_moe.dict.yaml)
          curl -s -X POST \
            "https://rime.ichimarugin728.dev/workflow/dict-update" \
            -H "Authorization: Bearer ${{ secrets.WORKER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"dict\":\"tone_moe\",\"r2Key\":\"dicts/tone_moe.dict.yaml\",\"date\":\"${DATE}\",\"lines\":${LINES},\"triggeredBy\":\"sync-upstream\"}"

      - name: Open PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/moetype-${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git add -f dicts/tone_moe.dict.yaml .upstream/moetype.tag
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: moetype ${{ steps.meta.outputs.tag }}"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "sync: moetype ${{ steps.meta.outputs.tag }}" \
            --body "Auto-synced from [moetype](https://github.com/suiginko/moetype/releases/tag/${{ steps.meta.outputs.tag }})." \
            --base main --head "$BRANCH" || true

  # ── 雾凇 melt_eng ───────────────────────────────────────────
  sync-melt-eng:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest commit sha
        id: meta
        run: |
          SHA=$(curl -s "https://api.github.com/repos/iDvel/rime-ice/commits?path=melt_eng.schema.yaml&per_page=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'][:7])")
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Check sha
        id: check
        run: |
          CURRENT=$(cat .upstream/rime-ice-melt.sha 2>/dev/null || echo "none")
          echo "stale=$( [ '$CURRENT' != '${{ steps.meta.outputs.sha }}' ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Clone and copy
        if: steps.check.outputs.stale == 'true'
        run: |
          git clone --depth 1 https://github.com/iDvel/rime-ice.git /tmp/rime-ice
          mkdir -p scheme/shared/core/en_dicts
          cp /tmp/rime-ice/melt_eng.schema.yaml scheme/shared/core/
          cp -r /tmp/rime-ice/en_dicts/. scheme/shared/core/en_dicts/
          mkdir -p .upstream && echo "${{ steps.meta.outputs.sha }}" > .upstream/rime-ice-melt.sha

      - name: Open PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/melt-eng-${{ steps.meta.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git add scheme/shared/core/ .upstream/rime-ice-melt.sha
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: rime-ice melt_eng ${{ steps.meta.outputs.sha }}"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "sync: rime-ice melt_eng ${{ steps.meta.outputs.sha }}" \
            --body "Auto-synced melt_eng + en_dicts from [rime-ice](https://github.com/iDvel/rime-ice)." \
            --base main --head "$BRANCH" || true

  # ── 古诗词 ──────────────────────────────────────────────────
  sync-chinese-poetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest commit sha
        id: meta
        run: |
          SHA=$(curl -s "https://api.github.com/repos/chinese-poetry/chinese-poetry/commits?per_page=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'][:7])")
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Check sha
        id: check
        run: |
          CURRENT=$(cat .upstream/chinese-poetry.sha 2>/dev/null || echo "none")
          echo "stale=$( [ '$CURRENT' != '${{ steps.meta.outputs.sha }}' ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Record sha
        if: steps.check.outputs.stale == 'true'
        run: |
          mkdir -p .upstream && echo "${{ steps.meta.outputs.sha }}" > .upstream/chinese-poetry.sha

      - name: Open PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/chinese-poetry-${{ steps.meta.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git add .upstream/chinese-poetry.sha
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: chinese-poetry ${{ steps.meta.outputs.sha }}"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "sync: chinese-poetry ${{ steps.meta.outputs.sha }}" \
            --body "Upstream [chinese-poetry](https://github.com/chinese-poetry/chinese-poetry) updated. Merge to trigger shici rebuild." \
            --base main --head "$BRANCH" || true
