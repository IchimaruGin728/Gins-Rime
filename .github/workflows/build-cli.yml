name: Build CLI Script

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Upload zsh script to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put gins-rime/cli/gins-rime-latest \
            --file tools/gins-rime \
            --content-type "application/x-sh"
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          echo "{\"sha\":\"${SHA}\",\"date\":\"${DATE}\"}" > /tmp/cli-meta.json
          npx wrangler r2 object put gins-rime/cli/meta.json \
            --file /tmp/cli-meta.json \
            --content-type "application/json"
