name: Build CLI Swift

on:
  push:
    branches: [main]
    paths:
      - 'tools/gins-rime-cli/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift binary
        working-directory: tools/gins-rime-cli
        run: |
          swift build -c release
          cp .build/release/GinsRime /tmp/gins-rime-native
          chmod +x /tmp/gins-rime-native

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler r2 object put gins-rime/cli/gins-rime-native \
            --file /tmp/gins-rime-native \
            --content-type "application/octet-stream"
