name: Release Scheme

on:
  push:
    branches: [ main ]
    paths:
      - 'scheme/**'
      - 'lua/**'
      - 'dicts/**'
      - 'rime.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-scheme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create scheme bundle
        run: |
          mkdir -p dist/scheme
          # Copy shared files
          cp scheme/shared/*.yaml dist/scheme/
          # Copy core files and dictionaries
          cp scheme/shared/core/*.yaml dist/scheme/
          if [ -d "scheme/shared/core/en_dicts" ]; then
            cp -r scheme/shared/core/en_dicts dist/scheme/
          fi
          # Copy squirrel files
          cp scheme/squirrel/*.yaml dist/scheme/
          
          # Copy Lua engine (Crucial for functionality)
          cp -r lua dist/scheme/
          cp rime.lua dist/scheme/

          # Unified Dictionary Consolidation (Merging Core and Thematic dicts)
          mkdir -p dist/scheme/dicts
          
          # 1. Copy core dictionaries from scheme/shared/core/dicts
          if [ -d "scheme/shared/core/dicts" ]; then
            cp scheme/shared/core/dicts/*.dict.yaml dist/scheme/dicts/ 2>/dev/null || true
          fi
          
          # 2. Copy thematic dictionaries from root dicts/ folder
          if [ -d "dicts" ]; then
            cp -r dicts/* dist/scheme/dicts/ 2>/dev/null || true
          fi
          
          # Cleanup: ensure no original wanxiang-branded files leaked (safety check)
          find dist/scheme -type f -name "wanxiang*" -delete
          
          cd dist
          tar -czf scheme.tar.gz scheme/
          ls -lh scheme.tar.gz

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Upload scheme bundle
          npx wrangler r2 object put gins-rime/releases/scheme.tar.gz \
            --file dist/scheme.tar.gz \
            --content-type "application/gzip"

      - name: Update Worker metadata
        run: |
          VERSION=$(date +%Y%m%d%H%M)
          RESPONSE=$(curl -s -X POST \
            "https://rime.ichimarugin728.dev/api/scheme-update" \
            -H "Authorization: Bearer ${{ secrets.WORKER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"${VERSION}\",
              \"r2Key\": \"releases/scheme.tar.gz\",
              \"triggeredBy\": \"github-actions\"
            }")
          echo "Worker response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('ok') else 1)"
