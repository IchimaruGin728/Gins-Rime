name: release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Install worker deps
        working-directory: workers/gins-rime
        run: pnpm install --frozen-lockfile

      - name: Build Swift CLI
        working-directory: tools/gins-rime-cli
        run: |
          swift build -c release
          echo "CLI_FILE=$(swift build -c release --show-bin-path)/GinsRime" >> "$GITHUB_ENV"

      - name: Publish release assets to R2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash tools/publish-r2-release.sh
