name: Build zhwiki Dictionary

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  DUMP_URL: https://dumps.wikimedia.org/zhwiki/latest/zhwiki-latest-pages-articles.xml.bz2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/zhwiki-builder/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/zhwiki-builder/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build zhwiki-builder
        working-directory: tools/zhwiki-builder
        run: cargo build --release

      - name: Download zhwiki dump
        run: |
          curl -L --retry 3 --retry-delay 10 -o zhwiki-dump.xml.bz2 "$DUMP_URL"
          ls -lh zhwiki-dump.xml.bz2

      - name: Build dictionary
        run: |
          ./tools/zhwiki-builder/target/release/zhwiki-builder \
            --input zhwiki-dump.xml.bz2 \
            --output zhwiki.dict.yaml \
            --min-len 2 --max-len 20
          LINES=$(wc -l < zhwiki.dict.yaml)
          echo "DICT_LINES=$LINES" >> $GITHUB_ENV

      - name: Validate
        run: |
          grep -q "^name: zhwiki" zhwiki.dict.yaml || (echo "Missing header" && exit 1)
          [ "$DICT_LINES" -gt 100000 ] || (echo "Too few entries: $DICT_LINES" && exit 1)

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          DATE=$(date +%Y%m%d)
          # 覆盖最新版
          wrangler r2 object put gins-rime/dicts/zhwiki.dict.yaml \
            --file zhwiki.dict.yaml \
            --content-type "text/yaml"
          # 保留带日期的历史版本
          wrangler r2 object put "gins-rime/dicts/history/zhwiki-${DATE}.dict.yaml" \
            --file zhwiki.dict.yaml \
            --content-type "text/yaml"
          echo "Uploaded to R2: dicts/zhwiki.dict.yaml ($DICT_LINES entries)"

      - name: Trigger DictUpdateWorkflow
        run: |
          DATE=$(date +%Y%m%d)
          RESPONSE=$(curl -s -X POST \
            "https://gins-rime-api.ichimarugin728.workers.dev/workflow/dict-update" \
            -H "Authorization: Bearer ${{ secrets.WORKER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"dict\": \"zhwiki\",
              \"r2Key\": \"dicts/zhwiki.dict.yaml\",
              \"date\": \"${DATE}\",
              \"lines\": ${DICT_LINES},
              \"triggeredBy\": \"github-actions\"
            }")
          echo "Workflow response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('instanceId') else 1)"
