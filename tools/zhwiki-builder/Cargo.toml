[package]
name = "zhwiki-builder"
version = "0.1.0"
edition = "2024"
description = "Build zhwiki pinyin dictionary for RIME from Wikipedia titles"

[dependencies]
flate2 = "1"
pinyin = "0.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
regex = "1"
opencc-rs = "0.5"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
