[package]
name = "shici-builder"
version = "0.1.0"
edition = "2024"
description = "Build classical poetry dictionary for RIME, deduped against 万象 shici"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
regex = "1"
opencc-rs = "0.5"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
