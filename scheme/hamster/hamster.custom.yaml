# Gins-Rime: 元书输入法 (元书 Hamster v3 v3) 自定义配置
#
# 部署方式:
#   1. 打包 scheme/shared/ + scheme/hamster/ + dicts/ 为 .zip
#   2. 通过 元书 Hamster v3 设置 > 输入方案 > 导入方案 导入
#   3. 或通过 Wi-Fi 上传到 Rime/ 目录
#   4. 执行"重新部署"
#
# 注意:
#   - 元书 Hamster v3 有"应用文件"和"键盘文件"两个目录
#   - 部署时"应用文件"会覆盖"键盘文件"
#   - 自造词需在重新部署前从"键盘文件"拷回
#
# 皮肤: 使用 jsonnet 模板系统（见 skins/）
# 脚本: 使用 JavaScript（见 scripts/），非 Lua

patch:
  schema_list:
    - schema: wanxiang
