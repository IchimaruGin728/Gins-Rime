patch:
  style:
    color_scheme: gins_liquid_light
    color_scheme_dark: gins_liquid_dark
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    memorize_size: false
    translucency: true
    mutual_exclusive: false
    show_paging: false
    corner_radius: 100
    hilited_corner_radius: 10
    border_height: 2
    border_width: 4
    spacing: 6
    shadow_size: 3
    candidate_format: "[label] [candidate]  [comment]"

  # ── 浅色：磨砂白玻璃 + 紫色高亮 ──────────────────────────────────
  preset_color_schemes/gins_liquid_light:
    name: "Gins Liquid Light"
    author: "IchimaruGin728"
    font_face: "SF Pro Text"
    font_point: 14
    label_font_face: "SF Pro Text"
    label_font_point: 11
    comment_font_face: "SF Mono"
    comment_font_point: 12
    corner_radius: 100
    hilited_corner_radius: 10
    border_height: 2
    border_width: 4
    back_color: 0x99FFFFFF
    border_color: 0x19000000
    text_color: 0xFF3C3C43
    hilited_text_color: 0xFF3C3C43
    hilited_back_color: 0x14B915D8
    candidate_text_color: 0xFF3C3C43
    hilited_candidate_text_color: 0xFFFFFFFF
    hilited_candidate_back_color: 0xFFB915D8
    comment_text_color: 0xFF8E8E93
    hilited_comment_text_color: 0xFFFFFFFF
    label_color: 0xFF000000
    hilited_label_color: 0xFFFFFFFF

  # ── 深色：磨砂黑玻璃 + 紫色高亮 ──────────────────────────────────
  preset_color_schemes/gins_liquid_dark:
    name: "Gins Liquid Dark"
    author: "IchimaruGin728"
    font_face: "SF Pro Text"
    font_point: 14
    label_font_face: "SF Pro Text"
    label_font_point: 11
    comment_font_face: "SF Mono"
    comment_font_point: 12
    corner_radius: 100
    hilited_corner_radius: 10
    border_height: 2
    border_width: 4
    back_color: 0xAA1C1C1E
    border_color: 0x33FFFFFF
    text_color: 0xFFEBEBF5
    hilited_text_color: 0xFFFFFFFF
    hilited_back_color: 0x1AB915D8
    candidate_text_color: 0xFFEBEBF5
    hilited_candidate_text_color: 0xFFFFFFFF
    hilited_candidate_back_color: 0xFFB915D8
    comment_text_color: 0xFF8E8E93
    hilited_comment_text_color: 0xFFFFFFFF
    label_color: 0xFFFFFFFF
    hilited_label_color: 0xFFFFFFFF
