patch:
  style:
    color_scheme: gins_liquid_light
    color_scheme_dark: gins_liquid_dark
    # ── 强制锁定官方横向布局 ─────────────────────────────────────
    horizontal: true
    candidate_list_layout: horizontal
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    # ── 官方比例：极其扁平，胶囊选中 ──────────────────────────────
    corner_radius: 10
    hilited_corner_radius: 100
    border_height: 3
    border_width: 10
    spacing: 16
    font_face: "SF Pro Text"
    font_point: 16
    label_font_point: 0
    shadow_size: 4
    line_spacing: 0

  preset_color_schemes:
    gins_liquid_light:
      name: "Gins Liquid Light"
      author: "IchimaruGin728"
      back_color: 0xF2F2F2
      border_color: 0xE2E2E2
      text_color: 0x444444
      hilited_text_color: 0xFFFFFFFF
      hilited_back_color: 0x00FFFFFF
      candidate_text_color: 0x444444
      hilited_candidate_text_color: 0xFFFFFFFF
      hilited_candidate_back_color: 0xCCB915D8
      comment_text_color: 0x999999
      hilited_comment_text_color: 0x99FFFFFF
      label_color: 0x00000000
      hilited_label_color: 0x00000000


    gins_liquid_dark:
      name: "Gins Liquid Dark"
      author: "IchimaruGin728"
      back_color: 0x1C1C1E
      border_color: 0x33FFFFFF
      text_color: 0xEBEBF5
      hilited_text_color: 0xFFFFFFFF
      hilited_back_color: 0x00FFFFFF
      candidate_text_color: 0xEBEBF5
      hilited_candidate_text_color: 0xFFFFFFFF
      hilited_candidate_back_color: 0xCCB915D8
      comment_text_color: 0x8E8E93
      hilited_comment_text_color: 0xFFFFFFFF
      label_color: 0x00000000
      hilited_label_color: 0x00000000
