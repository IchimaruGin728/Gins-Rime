# Gins-Rime: 万象拼音自定义 patch
# 基于万象拼音基础版，追加雾凇中英混输 + 自定义配置
#
# 万象方案自带的 Lua 扩展已非常丰富（24个脚本）:
#   - super_calculator (V前缀计算器)
#   - shijian (日期/时间/农历/节气)
#   - unicode (U前缀 Unicode 输入)
#   - number_translator (R前缀大写数字)
#   - super_replacer (emoji/简繁转换)
#   - user_predict (自训练预测)
#   - 等等
# 这些无需额外 patch，万象 schema 已内置

patch:
  # ── 声明 melt_eng 依赖 ──
  schema/dependencies/+:
    - melt_eng

  # ── 追加雾凇 melt_eng 中英混输翻译器 ──
  engine/translators/+:
    - table_translator@melt_eng

  # ── melt_eng 混输配置 ──
  melt_eng:
    dictionary: melt_eng
    enable_sentence: false
    enable_completion: true
    enable_user_dict: false
    initial_quality: 1.1       # 低于中文 (1.2)，高于 cn_en (0.5)
    comment_format:
      - xform/.*//             # 清除注释显示

  # ── 万象默认 page_size=6（7890用于声调选择）──
  # 如不需要声调辅助输入，可改为 9
  # menu/page_size: 6

  # ── 快捷键绑定 ──
  key_binder/bindings/+:
    # Ctrl+Shift+4 切换简繁
    - { when: always, accept: "Control+Shift+4", toggle: zh_simp_s2t }
    # Ctrl+Shift+E 切换中英混输
    - { when: always, accept: "Control+Shift+e", toggle: melt_eng }
